<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Weather Incident Report — National Weather Analytics</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">🌩️</div>
            <span class="brand-title">National Weather Analytics</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Live Dashboard</a></li>
            <li><a href="report.html" class="nav-link active">Report Incident</a></li>
            <li><a href="admin.html" class="nav-link">Admin Portal</a></li>
        </ul>
    </header>

    <!-- Main Container -->
    <main class="form-page-container">
        <div class="glass-card" style="padding: 2.5rem;">
            
            <div class="form-header">
                <h2>Submit Weather Report</h2>
                <p>Help crowd-verify weather hazards across India. Reports are checked automatically for duplicates and trust scores.</p>
            </div>

            <form id="reportForm">
                <div class="form-grid">
                    
                    <div class="filter-group full-width">
                        <label for="textContent">Incident Description *</label>
                        <textarea id="textContent" class="form-control" rows="4" placeholder="Describe the weather condition (e.g. Heavy waterlogging on MG Road, water level 2 feet deep, traffic stuck...)" required></textarea>
                    </div>

                    <div class="filter-group">
                        <label for="cityInput">City *</label>
                        <input type="text" id="cityInput" class="form-control" placeholder="e.g. Mumbai, Chennai" required>
                    </div>

                    <div class="filter-group">
                        <label for="stateInput">State *</label>
                        <input type="text" id="stateInput" class="form-control" placeholder="e.g. Maharashtra, Tamil Nadu" required>
                    </div>

                    <!-- Geolocation Inputs -->
                    <div class="filter-group">
                        <label for="latInput">Latitude (Auto / Manual) *</label>
                        <input type="number" step="any" id="latInput" class="form-control" placeholder="e.g. 19.0760" required>
                    </div>

                    <div class="filter-group">
                        <label for="lngInput">Longitude (Auto / Manual) *</label>
                        <input type="number" step="any" id="lngInput" class="form-control" placeholder="e.g. 72.8777" required>
                    </div>

                    <div class="filter-group full-width">
                        <button type="button" id="btnGPS" class="btn-primary" style="background: linear-gradient(135deg, var(--primary-teal), #0d9488); width: fit-content;">
                            📍 Capture Current GPS Location
                        </button>
                        <span id="gpsStatus" style="font-size:0.85rem; color:var(--text-secondary); margin-left:0.5rem;"></span>
                    </div>

                    <!-- Media Upload -->
                    <div class="filter-group full-width">
                        <label for="mediaFile">Photo / Video Proof (Optional — adds +20 Trust Score)</label>
                        <input type="file" id="mediaFile" class="form-control" accept="image/*,video/*">
                        <div id="uploadProgress" style="font-size:0.85rem; color:var(--primary-teal); margin-top:0.4rem; display:none;">
                            Uploading media...
                        </div>
                    </div>

                </div>

                <!-- Submission Status Box -->
                <div id="statusMessage" style="margin-top: 1.5rem; display: none; padding: 1rem; border-radius: 8px;"></div>

                <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <a href="index.html" class="form-control" style="width: auto; text-decoration: none; text-align: center;">Cancel</a>
                    <button type="submit" id="btnSubmitReport" class="btn-primary">
                        Submit Report
                    </button>
                </div>
            </form>

        </div>
    </main>

    <!-- Dependencies -->
    <script src="js/api.js"></script>
    
    <script>
        let uploadedMediaUrl = null;

        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. Geolocation capture button
            document.getElementById("btnGPS").addEventListener("click", () => {
                const statusSpan = document.getElementById("gpsStatus");
                if (!navigator.geolocation) {
                    statusSpan.innerText = "Geolocation is not supported by your browser.";
                    return;
                }
                statusSpan.innerText = "Locating position...";
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById("latInput").value = pos.coords.latitude.toFixed(6);
                        document.getElementById("lngInput").value = pos.coords.longitude.toFixed(6);
                        statusSpan.innerText = `✓ GPS captured: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                    },
                    (err) => {
                        statusSpan.innerText = `GPS Error: ${err.message}`;
                    }
                );
            });

            // 2. File Upload Change Listener
            document.getElementById("mediaFile").addEventListener("change", async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const progressDiv = document.getElementById("uploadProgress");
                progressDiv.style.display = "block";
                progressDiv.innerText = "Uploading media to weather-media bucket...";

                try {
                    const result = await uploadMedia(file);
                    uploadedMediaUrl = result.url;
                    progressDiv.innerHTML = `✓ Upload complete: <a href="${result.url}" target="_blank" style="color:#38bdf8;">View File</a>`;
                } catch (err) {
                    progressDiv.innerHTML = `<span style="color:#ef4444;">Upload failed: ${err.message}</span>`;
                }
            });

            // 3. Form Submit Handler
            document.getElementById("reportForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const btnSubmit = document.getElementById("btnSubmitReport");
                const statusMsg = document.getElementById("statusMessage");

                btnSubmit.disabled = true;
                btnSubmit.innerText = "Processing ML Pipeline...";

                const payload = {
                    source: "citizen",
                    text_content: document.getElementById("textContent").value,
                    city: document.getElementById("cityInput").value,
                    state: document.getElementById("stateInput").value,
                    latitude: parseFloat(document.getElementById("latInput").value),
                    longitude: parseFloat(document.getElementById("lngInput").value),
                    photo_url: uploadedMediaUrl,
                    video_url: null,
                    posted_at: new Date().toISOString()
                };

                try {
                    const response = await submitReport(payload);
                    
                    statusMsg.style.display = "block";
                    statusMsg.style.background = "rgba(16, 185, 129, 0.15)";
                    statusMsg.style.border = "1px solid rgba(16, 185, 129, 0.4)";
                    statusMsg.style.color = "#10b981";
                    
                    statusMsg.innerHTML = `
                        <strong>✓ Report Submitted Successfully!</strong><br/>
                        Categorized as <strong>${response.event_type}</strong> | Calculated Trust Score: <strong>${Math.round(response.trust_score)}/100</strong><br/>
                        Status: <strong>${response.verification_status.toUpperCase()}</strong>
                    `;

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2500);

                } catch (err) {
                    statusMsg.style.display = "block";
                    statusMsg.style.background = "rgba(239, 68, 68, 0.15)";
                    statusMsg.style.border = "1px solid rgba(239, 68, 68, 0.4)";
                    statusMsg.style.color = "#ef4444";
                    statusMsg.innerText = `Submission Error: ${err.message}`;
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Submit Report";
                }
            });
        });
    </script>
</body>
</html>
